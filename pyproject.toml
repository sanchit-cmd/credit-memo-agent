[project]
name = "credit-memo-agent"
version = "0.1.0"
description = "Generate cited preliminary credit memos from SEC 10-K filings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
]

[project.scripts]
credit-memo-agent = "agent.cli:main"

[tool.uv]
package = true
